<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico - AudioServer</title><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#f3f5f7;color:#202124}.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 10px #0001}.ok{color:#19753a}.bad{color:#b3261e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{font-size:1.4em;font-weight:700}.muted{color:#687078}input{padding:9px;width:100%;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;margin:4px;background:#e8edf3}button.primary{background:#1769e0;color:white}.alert{padding:9px 0;border-bottom:1px solid #eee}a{color:#1769e0}</style></head><body><p><a href="/">← Voltar ao painel</a></p><h1>Diagnóstico</h1><div class="grid"><div class="card"><div class="muted">Pasta de sons</div><div id="sounds" class="metric">—</div></div><div class="card"><div class="muted">Mixer de áudio</div><div id="mixer" class="metric">—</div></div><div class="card"><div class="muted">Spotify</div><div id="spotify" class="metric">—</div></div><div class="card"><div class="muted">Disco livre</div><div id="disk" class="metric">—</div></div></div><div class="card"><h2>Rede</h2><div id="network"></div><p class="muted">Tente acessar por <b>http://audioserver.local:8765/</b>. Se algum computador não resolver .local, continue usando o IP.</p></div><div class="card"><h2>Alertas de falha</h2><label><input id="enabled" type="checkbox" style="width:auto"> Enviar alertas por webhook</label><p><input id="webhook" placeholder="https://seu-endpoint/webhook"></p><button class="primary" onclick="save()">Salvar</button><button onclick="testAlert()">Enviar alerta de teste</button></div><div class="card"><h2>Eventos recentes</h2><div id="alerts" class="muted">Nenhum alerta.</div></div><script>const $=id=>document.getElementById(id);async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json()}async function save(){await post('/config/failure-alerts',{enabled:$('enabled').checked,webhook_url:$('webhook').value});refresh()}async function testAlert(){await post('/diagnostics/test-alert',{});setTimeout(refresh,500)}async function refresh(){try{const d=await(await fetch('/api/diagnostics')).json();$('sounds').textContent=d.sounds_directory_ok?'OK':'FALHA';$('sounds').className='metric '+(d.sounds_directory_ok?'ok':'bad');$('mixer').textContent=d.audio_mixer_ok?'OK':'FALHA';$('mixer').className='metric '+(d.audio_mixer_ok?'ok':'bad');$('spotify').textContent=d.spotify.running?'Conectado':'Não encontrado';$('spotify').className='metric '+(d.spotify.running?'ok':'bad');$('disk').textContent=d.disk_free_gb+' GB';$('network').innerHTML=`<b>Nome do Windows:</b> ${d.hostname}<br><b>Nome amigável:</b> ${d.friendly_name}<br><b>CPU:</b> ${d.cpu_percent}% · <b>Memória:</b> ${d.memory_percent}%`;$('enabled').checked=!!d.failure_alerts.enabled;$('webhook').value=d.failure_alerts.webhook_url||'';$('alerts').innerHTML=d.alerts.length?d.alerts.map(a=>`<div class="alert"><b>${a.time}</b> · ${a.severity}<br>${a.message}</div>`).join(''):'Nenhum alerta. '}catch(e){}}refresh();setInterval(refresh,5000)</script></body></html>
