<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioServer</title><style>*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;max-width:1200px;margin:0 auto;padding:24px;background:#f3f5f7;color:#202124}h1{margin:0}h2{margin-top:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{padding:7px 12px;border-radius:20px;font-weight:600}.online{background:#dff5e5;color:#176b32}.offline{background:#fde2e2;color:#9b1c1c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:16px}.sound,.schedule{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:10px 0;gap:12px}.sound:last-child,.schedule:last-child{border:0}button{padding:9px 13px;margin:3px;border:0;border-radius:9px;cursor:pointer;background:#e8edf3;font-weight:600}button.primary{background:#1769e0;color:white}button.danger{background:#fbe4e4;color:#a11}input[type=range]{width:100%}input[type=time],input[type=search],select{padding:9px;border:1px solid #ccd2d8;border-radius:8px;min-width:150px}.muted{color:#687078;font-size:.9em}.metric{font-size:1.5em;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{margin:14px 0}.field label{display:flex;justify-content:space-between;margin-bottom:6px}.history{max-height:320px;overflow:auto;font-family:Consolas,monospace;font-size:.85em}.event{border-bottom:1px solid #eee;padding:8px 0}.playing{border-left:5px solid #1769e0}.notice{padding:10px;border-radius:8px;background:#f6f8fa;margin-top:10px}.days{display:flex;gap:8px;flex-wrap:wrap}.day{display:flex;gap:4px;align-items:center;background:#f6f8fa;padding:6px 9px;border-radius:8px}.schedule-main{flex:1}.schedule-actions{white-space:nowrap}.category{margin-top:18px}.category h3{margin-bottom:6px}.fav{font-size:1.1em}.panel{border:1px solid #e4e7eb;border-radius:10px;padding:12px;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}</style></head><body>
<div class="top"><div><h1>AudioServer</h1><div class="muted">Central de áudio da rede</div></div><span id="onlineBadge" class="badge">Carregando...</span></div>
<div class="grid"><div id="statusCard" class="card"><h2>Agora</h2><div id="now" class="metric">—</div><p id="details" class="muted"></p><div class="row"><button class="danger" onclick="post('/stop')">■ Parar</button><button onclick="post('/pause')">Ⅱ Pausar</button><button onclick="post('/resume')">▶ Retomar</button></div></div><div class="card"><h2>Próximo alerta</h2><div id="nextAlert" class="metric">Nenhum</div><p id="serverClock" class="muted"></p></div><div class="card"><h2>Spotify</h2><div id="spotifyState" class="metric">—</div><p id="spotifyDetails" class="muted"></p></div></div>
<div class="grid"><div class="card"><h2>Volume do alerta</h2><div class="field"><label><span>Volume padrão</span><strong id="volumeValue">100%</strong></label><input id="volume" type="range" min="0" max="1" step="0.05" oninput="volumeValue.textContent=Math.round(this.value*100)+'%'" onchange="setVolume(this.value)"></div></div><div class="card"><h2>Ducking do Spotify</h2><div class="field"><label><span>Ativado</span><input id="duckEnabled" type="checkbox"></label></div><div class="field"><label><span>Spotify durante alerta</span><strong id="duckValue"></strong></label><input id="duckVolume" type="range" min="0" max="1" step="0.05" oninput="duckValue.textContent=Math.round(this.value*100)+'%'"></div><div class="field"><label><span>Fade para baixar</span><strong id="fadeDownValue"></strong></label><input id="fadeDown" type="range" min="0" max="5000" step="100" oninput="fadeDownValue.textContent=(this.value/1000).toFixed(1)+' s'"></div><div class="field"><label><span>Espera após alerta</span><strong id="delayValue"></strong></label><input id="delay" type="range" min="0" max="3000" step="100" oninput="delayValue.textContent=(this.value/1000).toFixed(1)+' s'"></div><div class="field"><label><span>Fade para restaurar</span><strong id="fadeUpValue"></strong></label><input id="fadeUp" type="range" min="0" max="5000" step="100" oninput="fadeUpValue.textContent=(this.value/1000).toFixed(1)+' s'"></div><button class="primary" onclick="saveDucking()">Salvar ducking</button></div></div>
<div class="card"><h2>Agendamentos</h2><div class="grid"><div><div class="field"><label>Áudio</label><select id="scheduleSound"></select></div><div class="field"><label>Horário</label><input id="scheduleTime" type="time"></div></div><div><div class="field"><label>Dias da semana</label><div class="days"><label class="day"><input type="checkbox" class="weekday" value="0">Seg</label><label class="day"><input type="checkbox" class="weekday" value="1">Ter</label><label class="day"><input type="checkbox" class="weekday" value="2">Qua</label><label class="day"><input type="checkbox" class="weekday" value="3">Qui</label><label class="day"><input type="checkbox" class="weekday" value="4">Sex</label><label class="day"><input type="checkbox" class="weekday" value="5">Sáb</label><label class="day"><input type="checkbox" class="weekday" value="6">Dom</label></div></div></div></div><div class="row"><button onclick="testSchedule()">Testar áudio</button><button class="primary" onclick="addSchedule()">+ Adicionar agendamento</button></div><div id="schedules" style="margin-top:14px"></div></div>
<div class="card"><h2>Biblioteca de sons</h2><div class="row"><input id="soundSearch" type="search" placeholder="Buscar áudio..." oninput="renderSounds()"><label><input id="favoritesOnly" type="checkbox" onchange="renderSounds()"> Só favoritos</label></div><div id="sounds"></div></div>
<div class="card"><h2>Histórico / relatório</h2><div id="history" class="history">Carregando...</div></div>
<script>
const $=id=>document.getElementById(id);let schedulesCache=[],soundsCache=[];function headers(){return {'Content-Type':'application/json'}}async function post(url,body={}){let r=await fetch(url,{method:'POST',headers:headers(),body:JSON.stringify(body)}),j=await r.json();if(!r.ok)alert(j.error||'Erro');await refresh();return j}function play(s){post('/play',{sound:s})}function setVolume(v){post('/volume',{volume:Number(v)})}function setRange(id,value,label,fmt){$(id).value=value;$(label).textContent=fmt(value)}async function saveDucking(){await post('/ducking',{enabled:$('duckEnabled').checked,duck_volume:Number($('duckVolume').value),fade_down_ms:Number($('fadeDown').value),restore_delay_ms:Number($('delay').value),fade_up_ms:Number($('fadeUp').value)})}function dayNames(days){if(!days||!days.length)return'Todos os dias';const n=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];return days.map(x=>n[x]).join(', ')}async function saveSchedules(){await post('/config/schedules',{schedules:schedulesCache})}async function addSchedule(){const sound=$('scheduleSound').value,time=$('scheduleTime').value,days=[...document.querySelectorAll('.weekday:checked')].map(x=>Number(x.value));if(!sound||!time){alert('Escolha áudio e horário.');return}schedulesCache.push({sound,time,weekdays:days,enabled:true});await saveSchedules()}function testSchedule(){const s=$('scheduleSound').value;if(s)play(s)}async function removeSchedule(i){schedulesCache.splice(i,1);await saveSchedules()}async function toggleSchedule(i){schedulesCache[i].enabled=!schedulesCache[i].enabled;await saveSchedules()}function renderSchedules(){const box=$('schedules');box.innerHTML=schedulesCache.length?schedulesCache.map((s,i)=>`<div class="schedule"><div class="schedule-main"><strong>${s.time} · ${s.sound}</strong><br><span class="muted">${dayNames(s.weekdays)} · ${s.enabled!==false?'Ativo':'Desativado'}</span></div><div class="schedule-actions"><button onclick="toggleSchedule(${i})">${s.enabled!==false?'Desativar':'Ativar'}</button><button class="danger" onclick="removeSchedule(${i})">Excluir</button></div></div>`).join(''):'<div class="muted">Nenhum agendamento.</div>'}
async function saveProfile(name){const p={sound:name,volume:Number($('pv-'+CSS.escape(name)).value),duck_enabled:$('pd-'+CSS.escape(name)).checked,duck_volume:Number($('pdu-'+CSS.escape(name)).value),alert_fade_in_ms:Number($('pfi-'+CSS.escape(name)).value),alert_fade_out_ms:Number($('pfo-'+CSS.escape(name)).value)};await post('/config/sound-profile',p)}async function toggleFav(name,current){await post('/config/sound-profile',{sound:name,favorite:!current})}function soundCard(x){const p=x.profile;const id=x.name;return `<div class="sound"><div style="flex:1"><div><button class="fav" onclick='toggleFav(${JSON.stringify(id)},${p.favorite})'>${p.favorite?'★':'☆'}</button><strong>${id}</strong> <span class="muted">${x.file}</span></div><div class="panel two"><label>Volume <input id="pv-${id}" type="range" min="0" max="1" step="0.05" value="${p.volume}"></label><label>Ducking <input id="pd-${id}" type="checkbox" ${p.duck_enabled?'checked':''}></label><label>Spotify durante alerta <input id="pdu-${id}" type="range" min="0" max="1" step="0.05" value="${p.duck_volume}"></label><label>Fade entrada (ms) <input id="pfi-${id}" type="number" min="0" max="10000" value="${p.alert_fade_in_ms}"></label><label>Fade saída (ms) <input id="pfo-${id}" type="number" min="0" max="10000" value="${p.alert_fade_out_ms}"></label><div><button onclick='saveProfile(${JSON.stringify(id)})'>Salvar perfil</button><button class="primary" onclick='play(${JSON.stringify(id)})'>▶ Tocar</button></div></div></div></div>`}function renderSounds(){const q=$('soundSearch').value.toLowerCase(),fav=$('favoritesOnly').checked;const filtered=soundsCache.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q))&&(!fav||x.profile.favorite));const groups={};filtered.forEach(x=>(groups[x.category]??=[]).push(x));$('sounds').innerHTML=Object.keys(groups).sort().map(c=>`<div class="category"><h3>${c}</h3>${groups[c].map(soundCard).join('')}</div>`).join('')||'<div class="muted">Nenhum áudio encontrado.</div>'}
async function refresh(){try{const s=await(await fetch('/status')).json();$('onlineBadge').textContent='● Online';$('onlineBadge').className='badge online';$('statusCard').className='card'+(s.playing?' playing':'');$('now').textContent=s.playing?(s.current_sound||'Alerta tocando'):'Nenhum alerta';$('details').textContent=s.ducking?.active?'Spotify reduzido':'Spotify em volume normal';$('serverClock').textContent='Relógio do servidor: '+new Date(s.server_time).toLocaleString();$('nextAlert').textContent=s.next_schedule?`${s.next_schedule.sound} · ${new Date(s.next_schedule.datetime).toLocaleString()}`:'Nenhum agendado';$('spotifyState').textContent=s.spotify?.running?'Spotify conectado':'Spotify não encontrado';$('spotifyDetails').textContent=s.spotify?.running?`Volume atual: ${Math.round((s.spotify.volume??0)*100)}% · sessões: ${s.spotify.sessions}`:'Abra o Spotify para habilitar o ducking.';setRange('volume',s.volume,'volumeValue',v=>Math.round(v*100)+'%');let d=s.ducking||{};$('duckEnabled').checked=d.enabled!==false;setRange('duckVolume',d.spotify_volume_during_alert??.2,'duckValue',v=>Math.round(v*100)+'%');setRange('fadeDown',d.fade_down_ms??1200,'fadeDownValue',v=>(v/1000).toFixed(1)+' s');setRange('delay',d.restore_delay_ms??200,'delayValue',v=>(v/1000).toFixed(1)+' s');setRange('fadeUp',d.fade_up_ms??2000,'fadeUpValue',v=>(v/1000).toFixed(1)+' s');const sj=await(await fetch('/sounds')).json();soundsCache=sj.sounds||[];renderSounds();const prev=$('scheduleSound').value;$('scheduleSound').innerHTML='<option value="">Selecione...</option>'+soundsCache.map(x=>`<option>${x.name}</option>`).join('');if(soundsCache.some(x=>x.name===prev))$('scheduleSound').value=prev;const cfg=await(await fetch('/config')).json();schedulesCache=cfg.schedules||[];renderSchedules();const hj=await(await fetch('/history')).json();$('history').innerHTML=hj.history.length?hj.history.map(x=>`<div class="event"><b>${x.time}</b> · ${x.action} · ${x.result}<br><span class="muted">${x.details||''}${x.scheduled_for?' · previsto '+x.scheduled_for:''}</span></div>`).join(''):'Sem eventos.'}catch(e){$('onlineBadge').textContent='● Offline';$('onlineBadge').className='badge offline'}}refresh();setInterval(refresh,3000)
</script></body></html>
