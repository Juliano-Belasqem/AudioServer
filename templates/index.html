<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioServer</title><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#f5f5f5;color:#222}.card{background:white;padding:20px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0001}button{padding:10px 14px;margin:4px;border:0;border-radius:8px;cursor:pointer}input{padding:9px;margin:4px}.sound{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px}.muted{color:#666;font-size:.9em}pre{white-space:pre-wrap}</style></head><body><h1>AudioServer</h1><div class="card"><h2>Status</h2><pre id="status">Carregando...</pre></div><div class="card"><h2>Sons detectados</h2><p class="muted">A lista é lida automaticamente de C:\Sounds. Basta copiar um novo arquivo de áudio para essa pasta.</p><div id="sounds"></div></div><div class="card"><h2>Controles</h2><button onclick="post('/stop')">Parar</button><button onclick="post('/pause')">Pausar</button><button onclick="post('/resume')">Retomar</button><br><label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" onchange="setVolume(this.value)"></label><br><button onclick="post('/maintenance',{enabled:true})">Ativar manutenção</button><button onclick="post('/maintenance',{enabled:false})">Desativar manutenção</button></div><div class="card"><h2>Histórico</h2><pre id="history">Carregando...</pre></div><script>function headers(){return {'Content-Type':'application/json'}}async function post(url,body={}){let r=await fetch(url,{method:'POST',headers:headers(),body:JSON.stringify(body)});let j=await r.json();if(!r.ok)alert(j.error||'Erro');refresh()}async function play(s){post('/play',{sound:s})}function setVolume(v){post('/volume',{volume:Number(v)})}async function refresh(){let s=await(await fetch('/status')).json();document.getElementById('status').textContent=JSON.stringify(s,null,2);document.getElementById('volume').value=s.volume;let sr=await fetch('/sounds');let sj=await sr.json();document.getElementById('sounds').innerHTML=sj.sounds.length?sj.sounds.map(x=>`<div class="sound"><span><strong>${x.name}</strong><br><span class="muted">${x.file}</span></span><button onclick='play(${JSON.stringify(x.name)})'>Tocar</button></div>`).join(''):'Nenhum áudio encontrado.';let hr=await fetch('/history');if(hr.ok){let hj=await hr.json();document.getElementById('history').textContent=JSON.stringify(hj.history,null,2)}}refresh();setInterval(refresh,5000)</script></body></html>
