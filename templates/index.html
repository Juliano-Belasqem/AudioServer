<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioServer</title><style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;max-width:1100px;margin:0 auto;padding:24px;background:#f3f5f7;color:#202124}h1{margin:0}h2{margin-top:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{padding:7px 12px;border-radius:20px;font-weight:600}.online{background:#dff5e5;color:#176b32}.offline{background:#fde2e2;color:#9b1c1c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #00000010;margin-bottom:16px}.sound{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.sound:last-child{border:0}button{padding:10px 15px;margin:4px;border:0;border-radius:9px;cursor:pointer;background:#e8edf3;font-weight:600}button.primary{background:#1769e0;color:#fff}button.danger{background:#fbe4e4;color:#a11}input[type=range]{width:100%}.muted{color:#687078;font-size:.9em}.metric{font-size:1.7em;font-weight:700}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{margin:15px 0}.field label{display:flex;justify-content:space-between;margin-bottom:6px}.history{max-height:300px;overflow:auto;font-family:Consolas,monospace;font-size:.85em}.event{border-bottom:1px solid #eee;padding:8px 0}.playing{border-left:5px solid #1769e0}.notice{padding:10px;border-radius:8px;background:#f6f8fa;margin-top:10px}
</style></head><body>
<div class="top"><div><h1>AudioServer</h1><div class="muted">Central de áudio da rede</div></div><span id="onlineBadge" class="badge">Carregando...</span></div>
<div class="grid">
 <div id="statusCard" class="card"><h2>Agora</h2><div id="now" class="metric">—</div><p id="details" class="muted"></p><div class="row"><button class="danger" onclick="post('/stop')">■ Parar</button><button onclick="post('/pause')">Ⅱ Pausar</button><button onclick="post('/resume')">▶ Retomar</button></div></div>
 <div class="card"><h2>Volume do alerta</h2><div class="field"><label><span>Volume</span><strong id="volumeValue">100%</strong></label><input id="volume" type="range" min="0" max="1" step="0.05" oninput="volumeValue.textContent=Math.round(this.value*100)+'%'" onchange="setVolume(this.value)"></div></div>
</div>
<div class="grid">
 <div class="card"><h2>Ducking do Spotify</h2><p class="muted">Reduz suavemente a música enquanto o alerta é reproduzido.</p><div class="field"><label><span>Ativado</span><input id="duckEnabled" type="checkbox"></label></div><div class="field"><label><span>Spotify durante alerta</span><strong id="duckValue"></strong></label><input id="duckVolume" type="range" min="0" max="1" step="0.05" oninput="duckValue.textContent=Math.round(this.value*100)+'%'"></div><div class="field"><label><span>Fade para baixar</span><strong id="fadeDownValue"></strong></label><input id="fadeDown" type="range" min="0" max="5000" step="100" oninput="fadeDownValue.textContent=(this.value/1000).toFixed(1)+' s'"></div><div class="field"><label><span>Espera após alerta</span><strong id="delayValue"></strong></label><input id="delay" type="range" min="0" max="3000" step="100" oninput="delayValue.textContent=(this.value/1000).toFixed(1)+' s'"></div><div class="field"><label><span>Fade para restaurar</span><strong id="fadeUpValue"></strong></label><input id="fadeUp" type="range" min="0" max="5000" step="100" oninput="fadeUpValue.textContent=(this.value/1000).toFixed(1)+' s'"></div><button class="primary" onclick="saveDucking()">Salvar ducking</button><div id="duckState" class="notice muted"></div></div>
 <div class="card"><h2>Sistema</h2><div id="system"></div><br><button onclick="post('/maintenance',{enabled:true})">Ativar manutenção</button><button onclick="post('/maintenance',{enabled:false})">Desativar manutenção</button></div>
</div>
<div class="card"><h2>Sons detectados</h2><p class="muted">Arquivos em C:\Sounds aparecem aqui automaticamente.</p><div id="sounds"></div></div>
<div class="card"><h2>Histórico</h2><div id="history" class="history">Carregando...</div></div>
<script>
const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json'}}
async function post(url,body={}){try{let r=await fetch(url,{method:'POST',headers:headers(),body:JSON.stringify(body)}),j=await r.json();if(!r.ok)alert(j.error||'Erro');await refresh();return j}catch(e){alert('Não foi possível comunicar com o AudioServer.')}}
function play(s){post('/play',{sound:s})}function setVolume(v){post('/volume',{volume:Number(v)})}
function setRange(id,value,label,formatter){$(id).value=value;$(label).textContent=formatter(value)}
async function saveDucking(){await post('/ducking',{enabled:$('duckEnabled').checked,duck_volume:Number($('duckVolume').value),fade_down_ms:Number($('fadeDown').value),restore_delay_ms:Number($('delay').value),fade_up_ms:Number($('fadeUp').value)})}
async function refresh(){try{let s=await(await fetch('/status')).json();$('onlineBadge').textContent='● Online';$('onlineBadge').className='badge online';$('statusCard').className='card'+(s.playing?' playing':'');$('now').textContent=s.playing?(s.current_sound||'Alerta tocando'):'Nenhum alerta';$('details').textContent=s.ducking?.active?'Spotify reduzido durante o alerta':'Spotify em volume normal';setRange('volume',s.volume,'volumeValue',v=>Math.round(v*100)+'%');let d=s.ducking||{};$('duckEnabled').checked=d.enabled!==false;setRange('duckVolume',d.spotify_volume_during_alert??.2,'duckValue',v=>Math.round(v*100)+'%');setRange('fadeDown',d.fade_down_ms??1200,'fadeDownValue',v=>(v/1000).toFixed(1)+' s');setRange('delay',d.restore_delay_ms??200,'delayValue',v=>(v/1000).toFixed(1)+' s');setRange('fadeUp',d.fade_up_ms??2000,'fadeUpValue',v=>(v/1000).toFixed(1)+' s');$('duckState').textContent=d.active?'Ducking ativo agora':'Ducking aguardando próximo alerta';$('system').innerHTML=`<div><b>Versão:</b> ${s.version}</div><div><b>Uptime:</b> ${Math.floor(s.uptime_seconds/60)} min</div><div><b>Áudios:</b> ${s.sounds_count}</div><div><b>Manutenção:</b> ${s.maintenance?'ativa':'desativada'}</div>`;let sj=await(await fetch('/sounds')).json();$('sounds').innerHTML=sj.sounds.length?sj.sounds.map(x=>`<div class="sound"><span><strong>${x.name}</strong><br><span class="muted">${x.file}</span></span><button class="primary" onclick='play(${JSON.stringify(x.name)})'>▶ Tocar</button></div>`).join(''):'Nenhum áudio encontrado.';let hj=await(await fetch('/history')).json();$('history').innerHTML=hj.history.length?hj.history.map(x=>`<div class="event"><b>${x.time}</b> · ${x.action} · ${x.result}<br><span class="muted">${x.details||''} · ${x.ip}</span></div>`).join(''):'Sem eventos ainda.'}catch(e){$('onlineBadge').textContent='● Offline';$('onlineBadge').className='badge offline'}}
refresh();setInterval(refresh,3000)
</script></body></html>
