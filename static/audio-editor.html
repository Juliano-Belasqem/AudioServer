<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de áudio • AudioServer</title><style>:root{--bg:#111;--panel:#232323;--border:#414141;--muted:#aaa;--accent:#8c35b4;--green:#22c55e;--orange:#f59e0b}*{box-sizing:border-box}body{font-family:Segoe UI,Arial;max-width:920px;margin:auto;padding:22px;background:var(--bg);color:#fff}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin:16px 0}input,select,button,a{background:#191919;color:#fff;border:1px solid #4b4b4b;border-radius:8px;padding:10px}button,a{cursor:pointer;text-decoration:none;font-weight:700}.primary{background:linear-gradient(135deg,#702397,#a34dcc)}.safe{background:#173820;border-color:#285f39;color:#a8f0bd}.warn{background:#4d3615;border-color:#73511e;color:#ffd796}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{width:100%}audio{width:100%;margin:12px 0}.hint{padding:12px;border-radius:10px;background:#171717;border:1px solid #383838}.value{font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div><h1>✂️ Editor de áudio</h1><div class="muted">Ajustes simples sem gerar a locução novamente.</div></div><div><a href="/static/offers.html">← Ofertas</a> <a href="/">Painel</a></div></div><div class="card"><label>Campanha<select id="campaign" class="wide" onchange="loadCampaign()"></select></label><audio id="audio" controls preload="metadata"></audio><div class="row"><button onclick="useCurrentAsStart()">Usar posição como início</button><button onclick="useCurrentAsEnd()">Usar posição como fim</button><button class="safe" onclick="previewSelection()">▶ Ouvir trecho selecionado</button></div></div><div class="card"><h2>Ajustes</h2><div class="grid"><label>Início (segundos)<input id="start" class="wide" type="number" min="0" step="0.01" value="0"></label><label>Fim (segundos)<input id="end" class="wide" type="number" min="0" step="0.01"></label><label>Volume<input id="volume" class="wide" type="range" min="0" max="2" step="0.05" value="1" oninput="volText.textContent=Math.round(this.value*100)+'%'"> <span id="volText" class="value">100%</span></label><label>Fade-in (s)<input id="fadeIn" class="wide" type="number" min="0" max="10" step="0.1" value="0"></label><label>Fade-out (s)<input id="fadeOut" class="wide" type="number" min="0" max="10" step="0.1" value="0"></label></div><div class="hint muted" style="margin-top:14px">O editor permite cortar o começo/fim, ajustar volume e aplicar fade-in/fade-out. Antes de salvar, o AudioServer cria automaticamente um backup do MP3 atual.</div><div class="row" style="margin-top:16px"><button class="primary" onclick="applyEdit()">💾 Aplicar edição</button><button class="warn" onclick="restoreLast()">↶ Restaurar último backup</button></div><div id="status" class="muted" style="margin-top:12px"></div></div><script>const $=x=>document.getElementById(x);let campaigns=[];let stopTimer=null;async function api(u,o){const r=await fetch(u,o);let j;try{j=await r.json()}catch{throw Error('Resposta inválida do servidor. Atualize a aplicação e tente novamente.')}if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){const j=await api('/offers');campaigns=(j.campaigns||[]).filter(c=>c.audio_sound);$('campaign').innerHTML=campaigns.length?campaigns.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.audio_sound)}</option>`).join(''):'<option>Nenhuma narração disponível</option>';const q=new URLSearchParams(location.search).get('id');if(q&&campaigns.some(c=>c.id===q))$('campaign').value=q;loadCampaign()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){return campaigns.find(c=>c.id===$('campaign').value)}function loadCampaign(){const c=current();if(!c)return;$('audio').src='/offers/audio/'+encodeURIComponent(c.id)+'?t='+Date.now();$('audio').load();$('start').value=0;$('volume').value=1;$('volText').textContent='100%';$('fadeIn').value=0;$('fadeOut').value=0;$('status').textContent='';$('audio').onloadedmetadata=()=>{$('end').value=$('audio').duration.toFixed(2)}}function useCurrentAsStart(){$('start').value=$('audio').currentTime.toFixed(2)}function useCurrentAsEnd(){$('end').value=$('audio').currentTime.toFixed(2)}function previewSelection(){const a=$('audio'),s=Number($('start').value||0),e=Number($('end').value||a.duration);if(e<=s)return alert('O fim precisa ser maior que o início.');clearInterval(stopTimer);a.currentTime=s;a.volume=Math.min(1,Number($('volume').value||1));a.play();stopTimer=setInterval(()=>{if(a.currentTime>=e||a.paused){a.pause();clearInterval(stopTimer)}},50)}async function applyEdit(){const c=current();if(!c)return;const body={id:c.id,start:Number($('start').value),end:Number($('end').value),volume:Number($('volume').value),fade_in:Number($('fadeIn').value),fade_out:Number($('fadeOut').value)};if(body.end<=body.start)return alert('O fim precisa ser maior que o início.');if(!confirm('Aplicar esta edição ao áudio da campanha? Um backup será criado automaticamente.'))return;$('status').textContent='Processando áudio...';try{await api('/offers/audio-edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('status').textContent='Edição aplicada. A campanha voltou para o status “Narração gerada” para nova revisão.';loadCampaign()}catch(e){$('status').textContent='Erro: '+e.message}}async function restoreLast(){const c=current();if(!c)return;if(!confirm('Restaurar o último backup desta narração?'))return;try{await api('/offers/audio-restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id})});$('status').textContent='Último backup restaurado.';loadCampaign()}catch(e){$('status').textContent='Erro: '+e.message}}load().catch(e=>$('status').textContent='Erro: '+e.message)</script></body></html>
