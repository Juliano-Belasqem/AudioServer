<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AudioServer • Acesso rápido</title>
<style>
:root{--bg:#0f0f12;--panel:#202027;--panel2:#2a2a33;--border:#3a3a46;--text:#f5f5f7;--muted:#aaaab7;--accent:#7d2aa8;--accent2:#a64ed1;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.top{position:sticky;top:0;z-index:10;background:#0f0f12ee;backdrop-filter:blur(12px);padding:14px 0 18px;border-bottom:1px solid #25252d}.toprow{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand h1{margin:0;font-size:26px}.muted{color:var(--muted)}.badge{padding:7px 12px;border-radius:999px;font-weight:700;background:#173820;color:#82e7a3}.toolbar,.music-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{margin-top:14px}.search{flex:1;min-width:220px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#19191f;color:white;font-size:16px}.btn{border:1px solid #494957;border-radius:10px;background:#30303a;color:white;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#9a4bc1}.btn.danger{background:#422323;border-color:#663232;color:#ffc2c2}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}.mini{background:linear-gradient(135deg,#23232a,#1c1c22);border:1px solid var(--border);border-radius:12px;padding:14px}.mini strong{display:block;font-size:20px;margin-top:5px}.musicbar{background:linear-gradient(135deg,#292329,#251d2c);border:1px solid #4d3459;border-radius:14px;padding:14px 16px;margin:0 0 18px;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(170px,260px);gap:14px;align-items:center}.music-title{font-weight:800;font-size:17px}.music-provider{font-size:12px;color:#d8b8e5}.music-controls .btn{padding:9px 12px;font-size:16px}.music-volume{display:grid;grid-template-columns:1fr 45px;gap:8px;align-items:center}.music-volume input{width:100%;accent-color:var(--accent2)}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px;color:#e8d7f1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.sound{min-height:112px;background:linear-gradient(145deg,#25252d,#1c1c22);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.sound:hover{transform:translateY(-2px);border-color:#75408c;box-shadow:0 8px 24px #0005}.name{font-weight:800;font-size:16px;word-break:break-word}.meta{font-size:12px;color:var(--muted);margin-top:4px}.play{width:100%;margin-top:12px;border:none;border-radius:9px;padding:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:800;cursor:pointer}.fav{color:#f2c94c}.pill{font-size:11px;padding:3px 7px;border-radius:999px;margin-left:5px;background:#343440;color:#ddd}.critical{background:#4a1f28;color:#ffb3bf}.high{background:#4b3616;color:#ffd28a}.normal{background:#28374d;color:#b9d4ff}.low{background:#333}.empty{padding:22px;color:var(--muted);border:1px dashed var(--border);border-radius:12px}.toast{position:fixed;right:20px;bottom:20px;background:#262630;border:1px solid #4c4c59;border-radius:10px;padding:12px 15px;box-shadow:0 10px 30px #0008;display:none}.toast.show{display:block}@media(max-width:780px){.musicbar{grid-template-columns:1fr}.music-volume{max-width:320px}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sound{min-height:125px}.name{font-size:14px}.top{padding-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="toprow"><div class="brand"><h1>⚡ Acesso rápido</h1><div class="muted">AudioServer • toque um alerta com um clique</div></div><div id="online" class="badge">● Conectando...</div></div>
    <div class="toolbar"><input id="search" class="search" placeholder="Buscar áudio..." oninput="render()"><button class="btn" onclick="toggleFavorites()" id="favBtn">☆ Favoritos</button><button class="btn danger" onclick="post('/stop')">■ Parar alerta</button><a class="btn" href="/static/music.html">🎵 Música</a><button class="btn" onclick="location.href='/'">Painel completo</button></div>
  </div>
  <div class="summary"><div class="mini"><span class="muted">Tocando agora</span><strong id="playing">Nenhum</strong></div><div class="mini"><span class="muted">Fila</span><strong id="queue">0</strong></div><div class="mini"><span class="muted">Próximo agendado</span><strong id="next">Nenhum</strong></div><div class="mini"><span class="muted">Spotify</span><strong id="spotify">—</strong></div></div>
  <div class="musicbar"><div><div class="music-provider" id="musicProvider">Música ambiente</div><div class="music-title" id="musicTrack">Carregando...</div><div class="muted" id="musicArtist"></div></div><div class="music-controls"><button class="btn" onclick="musicCmd('previous')">⏮</button><button class="btn primary" onclick="musicCmd('play_pause')">▶ / ⏸</button><button class="btn" onclick="musicCmd('next')">⏭</button><a class="btn" href="/static/music.html">Abrir</a></div><div class="music-volume"><input id="musicVolume" type="range" min="0" max="1" step="0.02" oninput="musicVolText.textContent=Math.round(this.value*100)+'%'" onchange="musicSetVolume(this.value)"><span id="musicVolText">—</span></div></div>
  <div id="content"></div>
</div>
<div id="toast" class="toast"></div>
<script>
let sounds=[],favoritesOnly=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){$('toast').textContent=msg;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',1800)}
async function post(url,body={}){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');if(url==='/play')toast('Áudio enviado para a fila');await refreshStatus();return j}catch(e){toast(e.message)}}
function play(name){post('/play',{sound:name})}
function toggleFavorites(){favoritesOnly=!favoritesOnly;$('favBtn').textContent=favoritesOnly?'★ Favoritos':'☆ Favoritos';render()}
function card(x){const p=x.profile||{},pri=p.priority||'normal';return `<div class="sound"><div><div class="name">${p.favorite?'<span class="fav">★</span> ':''}${esc(x.name)} <span class="pill ${pri}">${pri}</span></div><div class="meta">${esc(x.category||'Geral')}</div></div><button class="play" onclick='play(${JSON.stringify(x.name)})'>▶ Tocar agora</button></div>`}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=sounds.filter(x=>(!favoritesOnly||x.profile?.favorite)&&(!q||x.name.toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q)));const groups={};filtered.forEach(x=>(groups[x.category||'Geral']??=[]).push(x));const cats=Object.keys(groups).sort((a,b)=>a.localeCompare(b));$('content').innerHTML=cats.length?cats.map(c=>`<div class="section"><h2>${esc(c)}</h2><div class="grid">${groups[c].map(card).join('')}</div></div>`).join(''):'<div class="empty">Nenhum áudio encontrado.</div>'}
async function musicCmd(command){try{const r=await fetch('/music/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');toast('Comando enviado à música');setTimeout(refreshMusic,400)}catch(e){toast(e.message)}}
async function musicSetVolume(value){try{const r=await fetch('/music/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'volume',value:Number(value)})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');refreshMusic()}catch(e){toast(e.message)}}
async function refreshMusic(){try{const r=await fetch('/music/status'),m=await r.json();$('musicProvider').textContent=(m.provider_name||'Música ambiente')+(m.available?' • conectado':' • não encontrado');$('musicTrack').textContent=m.track||(m.available?'Spotify Desktop':'Nenhuma música detectada');$('musicArtist').textContent=m.artist||'';if(m.volume!=null){$('musicVolume').value=m.volume;$('musicVolText').textContent=Math.round(m.volume*100)+'%'}}catch(e){$('musicTrack').textContent='Música indisponível'}}
async function refreshStatus(){try{const [sr,qr]=await Promise.all([fetch('/status'),fetch('/queue')]);const s=await sr.json(),q=await qr.json();$('online').textContent='● Online';$('online').style.background='#173820';$('online').style.color='#82e7a3';$('playing').textContent=s.current_sound||'Nenhum';$('queue').textContent=String(s.queue_length??q.queue?.length??0);$('next').textContent=s.next_schedule?`${s.next_schedule.sound} · ${s.next_schedule.time}`:'Nenhum';$('spotify').textContent=s.spotify?.running?'Conectado':'Não encontrado'}catch(e){$('online').textContent='● Offline';$('online').style.background='#421c1c';$('online').style.color='#ff9f9f'}}
async function load(){try{const r=await fetch('/sounds'),j=await r.json();sounds=j.sounds||[];render();refreshStatus();refreshMusic()}catch(e){$('content').innerHTML='<div class="empty">Não foi possível carregar a biblioteca.</div>'}}
load();setInterval(refreshStatus,2500);setInterval(refreshMusic,4000);setInterval(load,15000);
</script>
</body></html>
