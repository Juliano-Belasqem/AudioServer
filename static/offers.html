<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ofertas • AudioServer</title><style>:root{--bg:#111;--panel:#232323;--border:#414141;--muted:#aaa;--accent:#8c35b4}*{box-sizing:border-box}body{font-family:Segoe UI,Arial;max-width:1100px;margin:auto;padding:22px;background:var(--bg);color:#fff}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin:16px 0}input,textarea,select,button,a{background:#191919;color:#fff;border:1px solid #4b4b4b;border-radius:8px;padding:10px}button,a{cursor:pointer;text-decoration:none;font-weight:700}.primary{background:linear-gradient(135deg,#702397,#a34dcc)}.danger{background:#442323}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:8px;margin:8px 0}.campaign{border-top:1px solid #444;padding:14px 0}.campaign:first-child{border:0}textarea{width:100%;min-height:150px}.wide{width:100%}@media(max-width:700px){.grid,.item{grid-template-columns:1fr}}</style></head><body><div class="top"><div><h1>📣 Ofertas</h1><div class="muted">Campanhas, roteiro, narração e programação automática.</div></div><div><a href="/static/quick.html">⚡ Alertas</a> <a href="/">Painel</a></div></div><div class="card"><h2>ElevenLabs</h2><div id="keyState" class="muted"></div><div class="grid"><label>Voice ID<input id="voice" class="wide" placeholder="ID da voz"></label><label>Modelo<select id="model" class="wide"><option>eleven_multilingual_v2</option><option>eleven_v3</option><option>eleven_flash_v2_5</option></select></label></div><button onclick="saveSettings()">Salvar configuração</button><div class="muted">A chave da API não aparece nem é salva aqui; ela fica somente como ELEVENLABS_API_KEY no Windows.</div></div><div class="card"><h2>Nova campanha / edição</h2><input id="cid" type="hidden"><div class="grid"><label>Nome<input id="name" class="wide" value="Ofertas da semana"></label><label>Intervalo entre locuções (min)<input id="interval" class="wide" type="number" min="1" value="30"></label><label>Início<input id="start" class="wide" type="datetime-local"></label><label>Fim<input id="end" class="wide" type="datetime-local"></label></div><h3>Produtos</h3><div id="items"></div><button onclick="addItem()">+ Produto</button><div class="grid"><label>Introdução<input id="intro" class="wide" placeholder="Atenção para as ofertas..."></label><label>Encerramento<input id="outro" class="wide" placeholder="Aproveite..."></label></div><button class="primary" onclick="generateScript()">Gerar roteiro</button><h3>Roteiro para aprovação</h3><textarea id="script" placeholder="Gere o roteiro e revise preços, produtos e condições antes de criar o áudio."></textarea><div class="row"><button class="primary" onclick="saveCampaign()">Salvar campanha</button><button onclick="saveAndNarrate()">🎙 Salvar e gerar narração</button><button onclick="clearForm()">Limpar</button></div></div><div class="card"><h2>Campanhas</h2><div id="campaigns"></div></div><script>const $=x=>document.getElementById(x);let campaigns=[];function itemRow(x={}){const d=document.createElement('div');d.className='item';d.innerHTML=`<input class="prod" placeholder="Produto" value="${esc(x.product||'')}"><input class="price" placeholder="24,90" value="${esc(x.price||'')}"><input class="detail" placeholder="Detalhe: pacote 5 kg" value="${esc(x.detail||'')}"><button class="danger" onclick="this.parentElement.remove()">×</button>`;$('items').appendChild(d)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addItem(){itemRow()}function getItems(){return [...document.querySelectorAll('.item')].map(d=>({product:d.querySelector('.prod').value,price:d.querySelector('.price').value,detail:d.querySelector('.detail').value})).filter(x=>x.product)}async function api(u,o){const r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}function payload(){return{id:$('cid').value||undefined,name:$('name').value,start:$('start').value,end:$('end').value,interval_minutes:Number($('interval').value),enabled:true,items:getItems(),intro:$('intro').value,outro:$('outro').value,script:$('script').value}}async function generateScript(){try{const j=await api('/offers/script',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});$('script').value=j.script}catch(e){alert(e.message)}}async function saveCampaign(){try{const j=await api('/offers/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});$('cid').value=j.campaign.id;await load();alert('Campanha salva.')}catch(e){alert(e.message)}}async function saveAndNarrate(){try{await saveCampaign();if(!confirm('Você revisou produtos, preços, datas e o roteiro? Gerar a narração agora?'))return;const j=await api('/offers/narrate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('cid').value})});alert('Narração criada: '+j.sound);await load()}catch(e){alert(e.message)}}async function saveSettings(){try{await api('/offers/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:$('voice').value,model_id:$('model').value})});alert('Configuração salva.')}catch(e){alert(e.message)}}function edit(id){const c=campaigns.find(x=>x.id===id);if(!c)return;$('cid').value=c.id;$('name').value=c.name;$('start').value=c.start;$('end').value=c.end;$('interval').value=c.interval_minutes;$('intro').value=c.intro||'';$('outro').value=c.outro||'';$('script').value=c.script||'';$('items').innerHTML='';c.items.forEach(itemRow);scrollTo(0,300)}async function del(id){if(!confirm('Excluir campanha?'))return;await api('/offers/campaigns/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});load()}async function play(sound){if(!sound)return alert('Gere a narração primeiro.');try{await api('/play',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sound})})}catch(e){alert(e.message)}}function clearForm(){$('cid').value='';$('script').value='';$('items').innerHTML='';itemRow();itemRow()}function render(){ $('campaigns').innerHTML=campaigns.length?campaigns.map(c=>`<div class="campaign"><b>${esc(c.name)}</b> · ${c.enabled?'Ativa':'Desativada'}<div class="muted">${esc(c.start||'sem início')} → ${esc(c.end||'sem fim')} · a cada ${c.interval_minutes} min · áudio: ${esc(c.audio_sound||'não gerado')}</div><div class="row"><button onclick="edit('${c.id}')">Editar</button><button onclick="play(${JSON.stringify(c.audio_sound||'')})">▶ Testar</button><button class="danger" onclick="del('${c.id}')">Excluir</button></div></div>`).join(''):'<div class="muted">Nenhuma campanha.</div>'}async function load(){try{const j=await api('/offers');campaigns=j.campaigns||[];$('voice').value=j.settings.voice_id||'';$('model').value=j.settings.model_id||'eleven_multilingual_v2';$('keyState').textContent=j.api_key_configured?'● Chave da API configurada no servidor':'○ Chave da API ainda não configurada';render()}catch(e){alert(e.message)}}clearForm();load()</script></body></html>
