<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saídas de áudio • AudioServer</title><style>:root{--bg:#111;--panel:#232323;--border:#3d3d3d;--text:#f5f5f5;--muted:#b9b9b9;--accent:#7d2aa8;--accent2:#9a4fc5;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;max-width:900px;margin:auto;padding:24px;background:var(--bg);color:var(--text)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 8px 20px #0004}button,a.btn{display:inline-block;padding:10px 14px;border:1px solid #4a4a4a;border-radius:8px;background:#343434;color:white;text-decoration:none;font-weight:600;cursor:pointer}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#944cc0}.muted{color:var(--muted)}.ok{color:#8ee7a9}.bad{color:#ff9f9f}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{margin-top:14px;padding:12px;border-radius:10px;background:#2a2130;border:1px solid #4e325c}.device{padding:14px 0;border-bottom:1px solid #3a3a3a}.device:last-child{border:0}.device-head{display:flex;gap:10px;align-items:center}.device input[type=range]{width:100%;accent-color:var(--accent2)}.device-volume{display:grid;grid-template-columns:1fr 70px;gap:12px;align-items:center;margin:9px 0 0 28px}.default{background:#1b1b1b;border-radius:10px;padding:12px;margin-bottom:8px}@media(max-width:650px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}.device-volume{grid-template-columns:1fr 55px;margin-left:0}}</style></head><body><div class="top"><div><h1>Saídas dos alertas</h1><div class="muted">Escolha uma ou mais caixas para reproduzir cada alerta simultaneamente.</div></div><div class="row"><a class="btn" href="/">← Painel</a><a class="btn" href="/static/quick.html">⚡ Acesso rápido</a></div></div><div class="card"><div id="state" class="muted">Carregando...</div><div class="notice">O Spotify continua usando a saída escolhida no Mixer de Volume do Windows. Esta tela controla somente os alertas do AudioServer.</div><div id="devices" style="margin-top:14px"></div><div class="row" style="margin-top:18px"><button class="primary" onclick="saveOutputs()">Salvar saídas</button><button onclick="loadDevices()">Atualizar lista</button></div></div><script>let devices=[],selected=[];const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}function key(s){return btoa(unescape(encodeURIComponent(s))).replace(/[^a-zA-Z0-9]/g,'')}function render(){const chosen=new Map(selected.map(x=>[(x.device||''),Number(x.volume??1)]));let html=`<div class="device default"><div class="device-head"><input id="chk-default" type="checkbox" ${chosen.has('')?'checked':''}><strong>Padrão do Windows</strong></div><div class="device-volume"><input id="vol-default" type="range" min="0" max="1" step="0.05" value="${chosen.get('')??1}" oninput="document.getElementById('txt-default').textContent=Math.round(this.value*100)+'%'"><span id="txt-default">${Math.round((chosen.get('')??1)*100)}%</span></div></div>`;html+=devices.map(d=>{const k=key(d),v=chosen.get(d)??1;return `<div class="device"><div class="device-head"><input id="chk-${k}" type="checkbox" ${chosen.has(d)?'checked':''}><strong>${esc(d)}</strong></div><div class="device-volume"><input id="vol-${k}" type="range" min="0" max="1" step="0.05" value="${v}" oninput="document.getElementById('txt-${k}').textContent=Math.round(this.value*100)+'%'"><span id="txt-${k}">${Math.round(v*100)}%</span></div></div>`}).join('');document.getElementById('devices').innerHTML=html}async function loadDevices(){try{const [d,c]=await Promise.all([api('/api/audio-devices'),api('/config')]);devices=d.devices||[];selected=c.alert_outputs||[{device:'',volume:1}];document.getElementById('state').innerHTML='<span class="ok">● '+devices.length+' dispositivo(s) detectado(s)</span>';render()}catch(e){document.getElementById('state').innerHTML='<span class="bad">Erro: '+esc(e.message)+'</span>'}}async function saveOutputs(){const outputs=[];if(document.getElementById('chk-default').checked)outputs.push({device:'',volume:Number(document.getElementById('vol-default').value)});for(const d of devices){const k=key(d);if(document.getElementById('chk-'+k).checked)outputs.push({device:d,volume:Number(document.getElementById('vol-'+k).value)})}if(!outputs.length)return alert('Selecione pelo menos uma saída.');try{await api('/config/alert-outputs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outputs})});selected=outputs;alert('Saídas dos alertas salvas. O próximo alerta será reproduzido em todas as saídas selecionadas.')}catch(e){alert(e.message)}}loadDevices()</script></body></html>
