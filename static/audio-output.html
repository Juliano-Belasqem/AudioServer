<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saídas de áudio • AudioServer</title><style>:root{--bg:#111;--panel:#232323;--border:#3d3d3d;--text:#f5f5f5;--muted:#b9b9b9;--accent:#7d2aa8;--accent2:#9a4fc5;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;max-width:980px;margin:auto;padding:24px;background:var(--bg);color:var(--text)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 8px 20px #0004}button,a.btn{display:inline-block;padding:10px 14px;border:1px solid #4a4a4a;border-radius:8px;background:#343434;color:white;text-decoration:none;font-weight:600;cursor:pointer}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#944cc0}.muted{color:var(--muted)}.ok{color:#8ee7a9}.bad{color:#ff9f9f}.warn{color:#ffd28a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{margin-top:14px;padding:12px;border-radius:10px;background:#2a2130;border:1px solid #4e325c}.device{padding:14px;border:1px solid #3a3a3a;border-radius:10px;margin:10px 0;background:#1b1b1b}.device-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.device-main{display:flex;gap:10px;align-items:center}.controls{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:end;margin-top:12px}.controls input[type=range]{width:100%;accent-color:var(--accent2)}input,select{background:#161616;color:#fff;border:1px solid #4a4a4a;border-radius:8px;padding:9px}.status{font-size:.88em}.testbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.testbar select{min-width:260px}@media(max-width:700px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr}.device-head{align-items:flex-start;flex-direction:column}.testbar select{width:100%;min-width:0}}</style></head><body><div class="top"><div><h1>Saídas dos alertas</h1><div class="muted">Volumes independentes e calibração de sincronização.</div></div><div class="row"><a class="btn" href="/">← Painel</a><a class="btn" href="/static/quick.html">⚡ Acesso rápido</a></div></div><div class="card"><div id="state" class="muted">Carregando...</div><div class="notice">O Spotify continua na saída escolhida no Mixer de Volume do Windows. Marque aqui todas as saídas em que os alertas devem tocar.</div><div id="devices"></div><div class="row" style="margin-top:18px"><button class="primary" onclick="saveOutputs()">Salvar saídas</button><button onclick="loadDevices()">Atualizar lista</button></div></div><script>let devices=[],selected=[],statuses=[];const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');async function api(url,opt){const r=await fetch(url,opt),text=await r.text();let j;try{j=text?JSON.parse(text):{}}catch(e){throw new Error(`O servidor respondeu HTTP ${r.status} em ${url}, mas não retornou JSON. Atualize o AudioServer e tente novamente.`)}if(!r.ok)throw new Error(j.error||`Erro HTTP ${r.status}`);return j}function key(s){return btoa(unescape(encodeURIComponent(s))).replace(/[^a-zA-Z0-9]/g,'')||'default'}function chosenMap(){return new Map(selected.map(x=>[(x.device||''),x]))}function statusFor(device){return statuses.find(x=>(x.device||x.name||'')===device)||null}function deviceCard(device,label,isDefault=false){const k=key(device),chosen=chosenMap(),cfg=chosen.get(device)||{volume:1,delay_ms:0},st=statusFor(device);const available=isDefault?true:(st?st.available:devices.includes(device));const state=available?'<span class="ok">● Disponível</span>':'<span class="bad">● Indisponível</span>';return `<div class="device"><div class="device-head"><div class="device-main"><input id="chk-${k}" type="checkbox" ${chosen.has(device)?'checked':''}><strong>${esc(label)}</strong></div><div class="status">${state}</div></div><div class="controls"><label>Volume<br><input id="vol-${k}" type="range" min="0" max="1" step="0.05" value="${Number(cfg.volume??1)}" oninput="document.getElementById('txt-${k}').textContent=Math.round(this.value*100)+'%'"><span id="txt-${k}">${Math.round(Number(cfg.volume??1)*100)}%</span></label><label>Atraso (ms)<br><input id="delay-${k}" type="number" min="0" max="5000" step="5" value="${Number(cfg.delay_ms??0)}"></label></div></div>`}function render(){let html=deviceCard('','Padrão do Windows',true);const names=new Set([...devices,...selected.map(x=>x.device).filter(Boolean)]);html+=[...names].sort().map(d=>deviceCard(d,d,false)).join('');document.getElementById('devices').innerHTML=html}async function loadDevices(){try{const [d,c]=await Promise.all([api('/api/audio-devices'),api('/config')]);devices=d.devices||[];statuses=d.outputs||d.device_status||[];selected=c.alert_outputs||[{device:'',volume:1,delay_ms:0}];document.getElementById('state').innerHTML='<span class="ok">● '+devices.length+' dispositivo(s) detectado(s)</span>';render()}catch(e){document.getElementById('state').innerHTML='<span class="bad">Erro: '+esc(e.message)+'</span>'}}function readOutput(device){const k=key(device);return {device,volume:Number(document.getElementById('vol-'+k).value),delay_ms:Number(document.getElementById('delay-'+k).value||0)}}async function saveOutputs(){const outputs=[];for(const device of ['',...new Set([...devices,...selected.map(x=>x.device).filter(Boolean)])]){const k=key(device),chk=document.getElementById('chk-'+k);if(chk&&chk.checked)outputs.push(readOutput(device))}if(!outputs.length)return alert('Selecione pelo menos uma saída.');try{await api('/config/alert-outputs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outputs})});selected=outputs;alert('Saídas salvas. Volume e atraso serão aplicados no próximo alerta.');await loadDevices()}catch(e){alert(e.message)}}loadDevices()</script></body></html>
